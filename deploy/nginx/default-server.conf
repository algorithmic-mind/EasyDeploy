# Unknown host names get no answer (444). Lines ending in "# ipv6" are removed by the installer
# on hosts without IPv6.
server {
    listen 80 default_server;
    listen [::]:80 default_server; # ipv6
    server_name _;
    include /etc/nginx/easydeploy/snippets/acme-challenge.conf;
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server; # ipv6
    server_name _;
    # Placeholder certificate so the handshake can complete before the connection is dropped
    # (ssl_reject_handshake needs nginx >= 1.19.4; Ubuntu 22.04 ships 1.18).
    ssl_certificate /etc/easydeploy/ssl/panel/fullchain.pem;
    ssl_certificate_key /etc/easydeploy/ssl/panel/privkey.pem;
    return 444;
}
