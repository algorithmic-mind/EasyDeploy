# EasyDeploy runtime directories (installed as /etc/tmpfiles.d/easydeploy.conf, §5.2).
# Nginx (www-data) may reach the API socket but never the agent socket.
d /run/easydeploy        0755 root       root      -
d /run/easydeploy/agent  0750 root       easydeploy -
d /run/easydeploy/api    2750 easydeploy www-data   -
