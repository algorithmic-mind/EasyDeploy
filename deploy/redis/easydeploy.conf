# EasyDeploy panel-internal Redis (ADR-0008). Included at the end of /etc/redis/redis.conf.
# Unix socket only, password protected; never used by user applications.
port 0
unixsocket /run/redis/redis-server.sock
unixsocketperm 770
maxmemory 64mb
# Only keys with a TTL (cache, channel messages) are evicted; Celery broker keys are kept.
maxmemory-policy volatile-lru
save ""
appendonly no
# requirepass is appended by the installer.
