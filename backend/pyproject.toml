[project]
name = "easydeploy-backend"
version = "0.1.0"
description = "EasyDeploy panel API (Django)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "django-filter>=24.3",
    "channels>=4.2",
    "channels-redis>=4.2",
    "uvicorn[standard]>=0.32",
    "celery[redis]>=5.4",
    "django-celery-beat>=2.7",
    "redis>=5.2",
    "structlog>=24.4",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "segno>=1.6",
    "cryptography>=43",
    "httpx>=0.28",
    "easydeploy-agent",
]

[tool.uv]
package = false

[tool.uv.sources]
easydeploy-agent = { workspace = true }

# mypy for the backend runs from this directory: `cd backend && uv run mypy .`
[tool.mypy]
python_version = "3.12"
platform = "linux"  # the agent, CLI and API only run on Linux servers
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main", "pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["/migrations/", "/tests/"]

[[tool.mypy.overrides]]
module = ["pyotp.*", "segno.*", "channels.*", "channels_redis.*", "django_celery_beat.*", "django_filters.*", "drf_spectacular.*", "argon2.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "easydeploy.settings.test"
