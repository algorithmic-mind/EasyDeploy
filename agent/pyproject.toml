[project]
name = "easydeploy-agent"
version = "0.1.0"
description = "EasyDeploy privileged host agent (typed ops over a Unix socket)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "psutil>=6.1",
    "structlog>=24.4",
    "idna>=3.10",
]

[project.scripts]
easydeploy-agent = "easydeploy_agent.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["easydeploy_agent"]
