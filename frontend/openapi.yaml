components:
  schemas:
    ActionEnum:
      enum:
      - start
      - stop
      - restart
      - reload
      - enable
      - disable
      type: string
      description: |-
        * `start` - start
        * `stop` - stop
        * `restart` - restart
        * `reload` - reload
        * `enable` - enable
        * `disable` - disable
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        prefix:
          type: string
          readOnly: true
        scopes: {}
        ip_allowlist: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_used_ip:
          type: string
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_used_at
      - last_used_ip
      - name
      - prefix
      - revoked_at
    ApiKeyCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        prefix:
          type: string
          readOnly: true
        scopes: {}
        ip_allowlist: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_used_ip:
          type: string
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        key:
          type: string
          readOnly: true
          description: Shown only once.
      required:
      - created_at
      - id
      - key
      - last_used_at
      - last_used_ip
      - name
      - prefix
      - revoked_at
    ApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes: {}
        ip_allowlist: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - name
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
          format: uuid
          nullable: true
        actor_label:
          type: string
          maxLength: 150
        action:
          type: string
          maxLength: 100
        module:
          type: string
          maxLength: 50
        resource_type:
          type: string
          maxLength: 50
        resource_id:
          type: string
          maxLength: 100
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 300
        request_id:
          type: string
          maxLength: 64
        result:
          $ref: '#/components/schemas/ResultEnum'
        changes: {}
        details: {}
      required:
      - action
      - created_at
      - id
      - module
    CalendarEnum:
      enum:
      - gregorian
      - jalali
      type: string
      description: |-
        * `gregorian` - Gregorian
        * `jalali` - Jalali
    ChmodRequest:
      type: object
      properties:
        paths:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 4096
          maxItems: 1000
          minItems: 1
        mode:
          type: string
          minLength: 1
          pattern: ^[0-7]{3,4}$
        recursive:
          type: boolean
          default: false
        confirm_protected:
          type: boolean
          default: false
      required:
      - mode
      - paths
    ChownRequest:
      type: object
      properties:
        paths:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 4096
          maxItems: 1000
          minItems: 1
        user:
          type: string
          minLength: 1
          pattern: ^[a-z_][a-z0-9_-]{0,31}$
        group:
          type: string
          minLength: 1
          pattern: ^[a-z_][a-z0-9_-]{0,31}$
        recursive:
          type: boolean
          default: false
        confirm_protected:
          type: boolean
          default: false
      required:
      - group
      - paths
      - user
    ContentRequest:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        content:
          type: string
          maxLength: 5242880
        expected_sha256:
          type: string
          minLength: 1
          pattern: ^[0-9a-f]{64}$
        create_only:
          type: boolean
          default: false
      required:
      - content
      - path
