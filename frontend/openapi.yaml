openapi: 3.0.3
info:
  title: EasyDeploy API
  version: 0.1.0-dev
  description: EasyDeploy server control panel API.
paths:
  /api/v1/audit/login-logs:
    get:
      operationId: audit_login_logs_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: reason
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
          format: date-time
      - in: query
        name: success
        schema:
          type: boolean
      - in: query
        name: until
        schema:
          type: string
          format: date-time
      - in: query
        name: username
        schema:
          type: string
      tags:
      - audit
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLoginLogList'
          description: ''
  /api/v1/audit/login-logs/{id}:
    get:
      operationId: audit_login_logs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this login log.
        required: true
      tags:
      - audit
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLog'
          description: ''
  /api/v1/audit/logs:
    get:
      operationId: audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: module
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      - in: query
        name: result
        schema:
          type: string
          enum:
          - failure
          - success
        description: |-
          * `success` - Success
          * `failure` - Failure
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
          format: date-time
      - in: query
        name: until
        schema:
          type: string
          format: date-time
      tags:
      - audit
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/logs/{id}:
    get:
      operationId: audit_logs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audit log.
        required: true
      tags:
      - audit
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/auth/2fa/disable:
    post:
      operationId: auth_2fa_disable_create
      tags:
      - auth
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/2fa/enable:
    post:
      operationId: auth_2fa_enable_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: ''
  /api/v1/auth/2fa/recovery-codes:
    post:
      operationId: auth_2fa_recovery_codes_create
      tags:
      - auth
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: ''
  /api/v1/auth/2fa/setup:
    post:
      operationId: auth_2fa_setup_create
      description: 'Start enrollment: a new secret is kept in the session until confirmed.'
      tags:
      - auth
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
          description: ''
  /api/v1/auth/api-keys:
    get:
      operationId: auth_api_keys_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - auth
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiKeyList'
          description: ''
    post:
      operationId: auth_api_keys_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
          description: ''
  /api/v1/auth/api-keys/{id}:
    get:
      operationId: auth_api_keys_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this api key.
        required: true
      tags:
      - auth
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
          description: ''
    delete:
      operationId: auth_api_keys_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this api key.
        required: true
      tags:
      - auth
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '204':
          description: Revoked
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the CSRF cookie; the SPA calls it once at startup.
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
  /api/v1/auth/login/2fa:
    post:
      operationId: auth_login_2fa_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/password:
    post:
      operationId: auth_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/sudo:
    post:
      operationId: auth_sudo_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SudoRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SudoResult'
          description: ''
  /api/v1/dashboard/system-info:
    get:
      operationId: dashboard_system_info_retrieve
      description: Static host information for the Overview page (from agent ``system.info``).
      tags:
      - dashboard
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
          description: ''
  /api/v1/files/chmod:
    post:
      operationId: files_chmod_create
      tags:
      - files
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChmodRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/files/chown:
    post:
      operationId: files_chown_create
      tags:
      - files
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChownRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/files/content:
    get:
      operationId: files_content_retrieve
      parameters:
      - in: query
        name: path
        schema:
          type: string
        required: true
      tags:
      - files
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
    put:
      operationId: files_content_update
      tags:
      - files
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/files/delete:
    post:
      operationId: files_delete_create
      description: Move to the recycle bin (restorable).
      tags:
      - files
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/files/download:
    get:
      operationId: files_download_retrieve
      parameters:
      - in: query
        name: path
        schema:
          type: string
        required: true
      tags:
      - files
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/files/list:
    get:
      operationId: files_list_retrieve
      parameters:
      - in: query
        name: hidden
        schema:
          type: boolean
      - in: query
        name: path
        schema:
          type: string
        required: true
      tags:
      - files
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/files/mkdir:
    post:
      operationId: files_mkdir_create
      tags:
      - files
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/files/move:
    post:
      operationId: files_move_create
      tags:
      - files
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/files/recycle:
    get:
      operationId: files_recycle_retrieve
      tags:
      - files
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/files/recycle/purge:
    post:
      operationId: files_recycle_purge_create
      description: 'Permanent deletion: sudo mode (§9.9).'
      tags:
      - files
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecycleIdsRequest'
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/files/recycle/restore:
    post:
      operationId: files_recycle_restore_create
      tags:
      - files
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecycleIdsRequest'
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/files/symlink:
    post:
      operationId: files_symlink_create
      tags:
      - files
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SymlinkRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/files/tasks/{action}:
    post:
      operationId: files_tasks_create
      description: Starts a long file operation as a Task and returns 202 {task_id}.
      parameters:
      - in: path
        name: action
        schema:
          type: string
        required: true
      tags:
      - files
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesTaskAccepted'
          description: ''
  /api/v1/files/uploads:
    post:
      operationId: files_uploads_create
      tags:
      - files
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreateRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatus'
          description: ''
  /api/v1/files/uploads/{upload_id}:
    get:
      operationId: files_uploads_retrieve
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatus'
          description: ''
    delete:
      operationId: files_uploads_destroy
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/files/uploads/{upload_id}/chunks/{index}:
    put:
      operationId: files_uploads_chunks_update
      parameters:
      - in: header
        name: X-Chunk-SHA256
        schema:
          type: string
      - in: path
        name: index
        schema:
          type: integer
        required: true
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/files/uploads/{upload_id}/complete:
    post:
      operationId: files_uploads_complete_create
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
          description: ''
  /api/v1/health:
    get:
      operationId: health_retrieve
      description: '``/api/v1/health`` — status only, no auth, answered **only** for
        localhost (§10.1).'
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/host/journal:
    get:
      operationId: host_journal_retrieve
      description: journald entries (System logs page, service details).
      parameters:
      - in: query
        name: grep
        schema:
          type: string
      - in: query
        name: lines
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
        description: YYYY-MM-DD[ HH:MM[:SS]]
      - in: query
        name: unit
        schema:
          type: string
      - in: query
        name: until
        schema:
          type: string
      tags:
      - host
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalResult'
          description: ''
  /api/v1/host/processes:
    get:
      operationId: host_processes_retrieve
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - cpu
          - memory
          - name
          - pid
      tags:
      - host
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessList'
          description: ''
  /api/v1/host/processes/{pid}:
    get:
      operationId: host_process_detail
      parameters:
      - in: path
        name: pid
        schema:
          type: integer
        required: true
      tags:
      - host
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDetail'
          description: ''
  /api/v1/host/processes/{pid}/signal:
    post:
      operationId: host_processes_signal_create
      parameters:
      - in: path
        name: pid
        schema:
          type: integer
        required: true
      tags:
      - host
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalRequest'
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResult'
          description: ''
  /api/v1/host/services:
    get:
      operationId: host_services_retrieve
      tags:
      - host
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceList'
          description: ''
  /api/v1/host/services/{unit}/action:
    post:
      operationId: host_services_action_create
      parameters:
      - in: path
        name: unit
        schema:
          type: string
          pattern: ^[A-Za-z0-9@:._-]{1,255}$
        required: true
      tags:
      - host
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceActionRequest'
        required: true
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceActionResult'
          description: ''
  /api/v1/monitoring/current:
    get:
      operationId: monitoring_current_retrieve
      description: One-shot live metrics (rates relative to the last stored sample).
      tags:
      - monitoring
      security:
      - apiKeyAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMetrics'
