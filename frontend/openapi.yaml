        name:
          type: string
          minLength: 1
          maxLength: 100
        command:
          type: string
          minLength: 1
          maxLength: 10000
        description:
          type: string
          maxLength: 300
      required:
      - command
      - name
    SudoRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
        code:
          type: string
          maxLength: 10
      required:
      - password
    SudoResult:
      type: object
      properties:
        sudo_until:
          type: string
          format: date-time
      required:
      - sudo_until
    SymlinkRequest:
      type: object
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 4096
        link:
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - link
      - target
    SystemInfo:
      type: object
      properties:
        hostname:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        kernel:
          type: string
        arch:
          type: string
        cpu_model:
          type: string
        cpu_cores:
          type: integer
        cpu_threads:
          type: integer
        memory_total:
          type: integer
        swap_total:
          type: integer
        uptime_seconds:
          type: integer
        agent_version:
          type: string
        panel_version:
          type: string
      required:
      - agent_version
      - arch
      - cpu_cores
      - cpu_model
      - cpu_threads
      - hostname
      - kernel
      - memory_total
      - os_name
      - os_version
      - panel_version
      - swap_total
      - uptime_seconds
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
          readOnly: true
        title_key:
          type: string
          readOnly: true
        title_params:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TaskStatusEnum'
          readOnly: true
        progress:
          type: integer
          readOnly: true
        progress_message:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
        parent:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        result:
          readOnly: true
          nullable: true
        error:
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - error
      - finished_at
      - id
      - kind
      - parent
      - progress
      - progress_message
      - resource_id
      - resource_type
      - result
      - started_at
      - status
      - title_key
      - title_params
    TaskAccepted:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
      required:
      - task_id
    TaskLog:
      type: object
      properties:
        lines:
          type: array
          items:
            type: string
      required:
      - lines
    TaskStatusEnum:
      enum:
      - pending
      - running
      - succeeded
      - failed
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `running` - Running
        * `succeeded` - Succeeded
        * `failed` - Failed
        * `cancelled` - Cancelled
    TerminalCheck:
      type: object
      properties:
        sudo_until:
          type: number
          format: double
        idle_minutes:
          type: integer
      required:
      - idle_minutes
      - sudo_until
    ThemeEnum:
      enum:
      - light
      - dark
      - system
      type: string
      description: |-
        * `light` - Light
        * `dark` - Dark
        * `system` - System
    TotpCodeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 10
      required:
      - code
    TotpSetup:
      type: object
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
        qr_svg:
          type: string
          description: SVG data URI of the QR code
      required:
      - otpauth_uri
      - qr_svg
      - secret
    TransferRequest:
      type: object
      properties:
        sources:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 4096
          maxItems: 1000
          minItems: 1
        destination:
          type: string
          minLength: 1
          maxLength: 4096
        rename:
          type: boolean
          default: false
        overwrite:
          type: boolean
          default: false
        confirm_protected:
          type: boolean
          default: false
      required:
      - destination
      - sources
    UploadCreateRequest:
      type: object
      properties:
        directory:
          type: string
          minLength: 1
          maxLength: 4096
        filename:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 0
        overwrite:
          type: boolean
          default: false
      required:
      - directory
      - filename
      - size
    UploadStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        destination:
          type: string
        size:
          type: integer
        chunk_size:
          type: integer
        total_chunks:
          type: integer
        received:
          type: array
          items:
            type: integer
        completed:
          type: boolean
      required:
      - chunk_size
      - completed
      - destination
      - id
      - received
      - size
      - total_chunks
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        language:
          $ref: '#/components/schemas/LanguageEnum'
        timezone:
          type: string
          maxLength: 64
        calendar:
          $ref: '#/components/schemas/CalendarEnum'
        theme:
          $ref: '#/components/schemas/ThemeEnum'
        totp_enabled:
          type: boolean
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - email
      - id
      - last_login
      - role
      - totp_enabled
      - username
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    sessionAuth:
      type: apiKey
      in: cookie
      name: ed_session
