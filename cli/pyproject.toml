[project]
name = "edctl"
version = "0.1.0"
description = "EasyDeploy command line tool (run as root on the server)"
requires-python = ">=3.12"
dependencies = ["typer>=0.12"]

[project.scripts]
edctl = "edctl.main:run_cli"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edctl"]
