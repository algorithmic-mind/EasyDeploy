name: Installer E2E

# Installs the panel from source on fresh runner VMs (Ubuntu 22.04 and 24.04) and runs the Phase 0
# acceptance checks (scripts/vm-acceptance.sh). Runners are disposable, so host changes are fine here.
on:
  schedule:
    - cron: "30 2 * * *"
  push:
    branches: ["release/**"]
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build frontend
        run: cd frontend && npm ci --no-audit --no-fund && npm run build
      - name: Install from source (timed)
        run: |
          start=$(date +%s)
          sudo bash installer/install.sh --from-source --yes --no-firewall --skip-docker-install --port 28443
          echo "INSTALL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Acceptance checks
        run: sudo --preserve-env=GITHUB_ACTIONS bash scripts/vm-acceptance.sh
      - name: Reinstall is idempotent
        run: |
          sudo bash installer/install.sh --from-source --yes --no-firewall --skip-docker-install --reinstall
          sudo --preserve-env=GITHUB_ACTIONS bash scripts/vm-acceptance.sh --after-reboot
      - name: Summary
        if: always()
        run: |
          echo "### ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Install time: ${INSTALL_SECONDS:-?} s" >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo edctl doctor || true
          sudo journalctl -u 'easydeploy-*' -u nginx -u redis-server -n 200 --no-pager || true
          sudo tail -n 100 /var/log/easydeploy/install.log || true
          # Annotations are readable without signing in to GitHub.
          for unit in easydeploy-agent easydeploy-api easydeploy-worker; do
            msg=$(sudo journalctl -u "$unit" -n 80 --no-pager -o cat 2>/dev/null \
              | grep -E 'File "|Error|error|Exception' | tail -n 14 | tail -c 3500 | tr '\n' '|')
            echo "::warning title=$unit::$msg"
          done
      - name: Uninstall
        run: sudo bash installer/uninstall.sh --purge --yes
