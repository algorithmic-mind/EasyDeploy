name: Installer E2E

# Installs the panel from source on a fresh runner VM (Ubuntu 22.04 and 24.04) and checks health.
# Nightly and on release branches (§14). Runners are disposable, so host changes are fine here.
on:
  schedule:
    - cron: "30 2 * * *"
  push:
    branches: ["release/**"]
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build frontend
        run: cd frontend && npm ci --no-audit --no-fund && npm run build
      - name: Install from source
        run: sudo bash installer/install.sh --from-source --yes --no-firewall --skip-docker-install --port 28443
      - name: Doctor
        run: sudo edctl doctor || (sudo journalctl -u 'easydeploy-*' -n 200 --no-pager; exit 1)
      - name: Reinstall is idempotent
        run: sudo bash installer/install.sh --from-source --yes --no-firewall --skip-docker-install --reinstall
      - name: Idle memory (RSS)
        run: |
          sleep 20
          ps -o rss=,comm= -u easydeploy,root | grep -E 'uvicorn|celery|python|redis' | awk '{s+=$1} END {printf "idle RSS: %.0f MB\n", s/1024}'
      - name: Uninstall
        run: sudo bash installer/uninstall.sh --purge --yes
