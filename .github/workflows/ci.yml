name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
      - name: Install
        run: uv sync --all-packages --frozen --python 3.12
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run python scripts/check_no_shell.py
          uv run python scripts/compile_messages.py --check
      - name: Type check
        run: |
          uv run mypy agent/easydeploy_agent cli/edctl
          cd backend && uv run mypy .
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: Security scan
        run: |
          uv run bandit -q -c pyproject.toml -r agent/easydeploy_agent cli/edctl backend/apps backend/easydeploy
          uvx pip-audit --strict --progress-spinner off -r <(uv export --frozen --no-dev --all-packages --no-emit-workspace --no-hashes)
      - name: OpenAPI schema is up to date
        run: |
          cd backend
          DJANGO_SETTINGS_MODULE=easydeploy.settings.test uv run python manage.py spectacular --validate --fail-on-warn --file ../frontend/openapi.yaml
          git diff --exit-code -- ../frontend/openapi.yaml

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API client is up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -P installer installer/*.sh installer/lib/*.sh scripts/*.sh
      - name: bats
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bats
          bats --tap installer/tests | tee bats.out || {
            grep -A6 '^not ok' bats.out | sed 's/^/::error title=bats::/'
            exit 1
          }
